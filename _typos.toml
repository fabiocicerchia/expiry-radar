# `enew` is Neovim's "edit a new empty buffer" command, not a misspelling of
# "new". The nvim specs open a scratch buffer with `vim.cmd('enew')` before
# asserting on what the plugin draws into it.
[default.extend-words]
enew = "enew"

# The file k8strust.go is "k8s" followed by "trust". Splitting that name turns
# up a fragment the dictionary reads as a misspelling of "trust", which it is
# anywhere else, so the identifier is excepted rather than the word allowed.
[default.extend-identifiers]
k8strust = "k8strust"
