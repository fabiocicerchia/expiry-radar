site_name: expiry-radar
site_description: >-
  One inventory of everything that expires, ranked by blast radius.
repo_url: https://github.com/fabiocicerchia/expiry-radar
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - Output formats: outputs.md
  - Sources and permissions: sources.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
