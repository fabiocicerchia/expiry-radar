name: code-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Nothing else in CI compiles the Go code — without this job a broken build
  # only shows up at release time.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@v2

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@master

      # pre-commit runs the language-specific hooks defined in
      # .pre-commit-config.yaml. It no-ops gracefully if none apply.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@v3.0.1
