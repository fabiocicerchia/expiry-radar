name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR cuts a
# draft GitHub Release for vX.Y.Z; the same run calls publish-extension.yml to
# attach the .vsix, then publishes the draft — which is what creates the tag.
# Draft first because releases here are immutable: once published, the assets
# are frozen.
#
# Why this is two release-please jobs and not one — do not collapse them back:
# a draft release has no git tag, publishing it is what creates the tag. A
# single invocation cuts the release and then computes the next release PR in
# the same run, while the release is still a draft — so there is no tag for the
# version already in .release-please-manifest.json, release-please loses its
# anchor, walks the entire history and opens a PR re-releasing everything.
# Merging that cuts another release, which opens another PR, forever. So:
#
#   release-please   phase 1 — cut the draft release only
#   extension        attach the .vsix
#   publish-release  publish the draft -> tag exists
#   release-pr       phase 2 — open/update the next release PR only

on:
  push:
    branches: [main]

# Two pushes landing seconds apart start two release-pr jobs, and both update
# refs/heads/release-please--branches--main — the loser dies on "Error updating
# ref". Queue them rather than cancelling: a release interrupted half-way is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        # The settings live in release-please-config.json rather than here,
        # because `extra-files` — which is what keeps the VS Code extension's
        # manifest on the same version as the tag — has no action input.
        # `release-type: simple` is still the strategy; it tracks version.txt
        # and CHANGELOG.md and is language-agnostic.
        with:
          skip-github-pull-request: true # phase 2 opens it, once the tag exists

  # The release release-please publishes carries GITHUB_TOKEN, and GitHub does
  # not start workflows from GITHUB_TOKEN events — so the extension publish is
  # called from here rather than hung off `on: release`.
  extension:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-extension.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Named rather than `secrets: inherit`: the reusable workflow gets the two
    # publishing tokens and nothing else this repository happens to hold.
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Binaries, the deb/rpm/apk/Arch packages, one SBOM per archive and a cosign
  # signature over the checksums — all of it from .goreleaser.yaml, so that
  # `goreleaser release --snapshot` on a laptop produces the same set.
  #
  # `--skip=publish` because the draft release already exists and this job only
  # attaches to it; `--skip=validate` because the tag it is building does not
  # exist until the draft is published, and GORELEASER_CURRENT_TAG is what
  # supplies the version in the meantime.
  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
      id-token: write # keyless signing via Sigstore
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release is still a draft here, so its tag ref does not exist
          # yet. This push *is* the release commit, so check that out instead.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: v2.16.0
          args: release --clean --skip=publish,announce,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when the secret is not set, which makes the cask's
          # skip_upload true rather than failing the release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag_name }}

      # Keyless Sigstore signing — no long-lived key to store or rotate. Verify
      # with: gh attestation verify <file> --repo <owner>/<repo>
      - name: sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst

      # Only the artifacts: dist/ also holds goreleaser's own metadata.json,
      # config.yaml and one directory per build target, none of which belong on
      # a release.
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          find dist -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.apk' -o -name '*.pkg.tar.zst' \
               -o -name 'checksums.txt*' -o -name '*.sbom.json' \) \
            -print0 | xargs -0 gh release upload "$TAG"

  # Immutable releases freeze a release's assets the moment it is published, so
  # release-please cuts it as a draft (`draft: true` in
  # release-please-config.json), the jobs above attach what belongs to it, and
  # this one publishes it. Publishing is also what creates the tag. If an attach
  # job fails the release stays a draft — a missing asset is recoverable, a
  # published release without it is not.
  publish-release:
    # Every asset — the .vsix and the binaries/packages — must be attached
    # before this publishes the draft and freezes it.
    needs: [release-please, extension, artifacts]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish the draft
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false

  # Phase 2 — open/update the next release PR, now that `publish-release` has
  # published the draft and the tag exists. `always()` because on an ordinary
  # push no release was cut and `publish-release` is skipped, yet the release PR
  # still has to be kept up to date; when a release *was* cut, `publish-release`
  # must have succeeded, or there is no tag to anchor on and this would
  # re-release the whole history.
  release-pr:
    needs: [release-please, publish-release]
    if: always()
      && needs.release-please.result == 'success'
      && (needs.release-please.outputs.release_created != 'true'
      || needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # open/update the release PR
    steps:
      # Same configuration as phase 1 — the two invocations must agree, and
      # both read release-please-config.json by default.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          skip-github-release: true
