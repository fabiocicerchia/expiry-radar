name: publish-extension

# Publishes the VS Code extension to both marketplaces. Called by release.yml
# when release-please cuts a release, so the extension ships with the tag and
# there is no second version to keep in step.
#
# It is a reusable workflow rather than an `on: release` one on purpose: the
# release release-please publishes carries GITHUB_TOKEN, and GitHub does not
# start workflows from GITHUB_TOKEN events. Called in the same run, it just
# works — no PAT to mint, rotate, or leak.
#
# Nothing happens without the tokens: each publish step is skipped when its
# secret is missing, so this file is inert until VSCE_PAT (VS Marketplace) and
# OVSX_PAT (Open VSX) are set in the repository's secrets. Marketplace versions
# are immutable — a version published once can never be replaced, only
# superseded — so the version check below is deliberately strict.
#
# DEADLINE: Azure DevOps retires global PATs on 2026-12-01, and VSCE_PAT is one.
# After that the Marketplace step has to authenticate through Microsoft Entra ID
# (`vsce publish --azure-credential`, fed by a federated credential rather than a
# stored secret). Open VSX is unaffected. Doing it needs an Azure app
# registration first, so it is a change to make deliberately, not on the day.
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.1.2"
        required: true
        type: string
    secrets:
      VSCE_PAT:
        description: "VS Marketplace token. Absent means the publish is skipped."
        required: false
      OVSX_PAT:
        description: "Open VSX token. Absent means the publish is skipped."
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 1.1.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the VSIX to the release
    env:
      EXT: extensions/vscode
      # Must match package.json's `name`: the Marketplace identity is
      # publisher.name, so a rename is a new extension, not a new version.
      VSIX_NAME: expiry-radar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The contract tests drive the real binary — the JSON shape, the warning
      # framing, the exit codes — and skip without one. Building it here is what
      # keeps `package` from going green on an extension that has quietly
      # stopped agreeing with the CLI it ships alongside.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the CLI
        run: make build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT:-${TAG#v}}"
          # The Marketplace takes x.y.z and nothing else, and refuses a version
          # it has seen before — better to fail here than half way through.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a publishable version (want x.y.z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX_NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"
          # release-please already writes this version into the manifest (see
          # release-please-config.json), so this is normally a no-op. It stays
          # for workflow_dispatch, and so that a mismatch can never ship.
          # No shell-lookalike ${...} inside the single quotes: the linter
          # would read JS template syntax as an unexpanded shell variable.
          node -e '
            const fs = require("node:fs")
            const path = process.argv[1] + "/package.json"
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
            pkg.version = process.argv[2]
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
          ' "$EXT" "$VERSION"
          echo "publishing $VSIX_NAME $VERSION"

      - name: Install
        run: npm --prefix "$EXT" ci

      # `package` runs vscode:prepublish first — typecheck, the tests, the
      # production bundle, then the licence and changelog the VSIX has to carry.
      # A red test never reaches a registry.
      - name: Package
        run: npm --prefix "$EXT" run package

      # `secrets` cannot be read from a job-level `if`, so which registries are
      # reachable is decided here and read back as step outputs.
      - name: Which registries are configured
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          {
            echo "marketplace=$([ -n "$VSCE_PAT" ] && echo true || echo false)"
            echo "openvsx=$([ -n "$OVSX_PAT" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to the VS Marketplace
        if: steps.tokens.outputs.marketplace == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: npx --yes @vscode/vsce@3.9.2 publish --no-dependencies --packagePath "$EXT/$VSIX"

      # Where VSCodium and Cursor look. A separate registry with its own
      # namespace and token, not a mirror of the Marketplace.
      - name: Publish to Open VSX
        if: steps.tokens.outputs.openvsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: npx --yes ovsx@1.1.1 publish "$EXT/$VSIX" -p "$OVSX_PAT"

      - name: Attach the VSIX to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: gh release upload "$TAG" "$EXT/$VSIX" --clobber

      # A run that publishes nowhere still has to say so, or "green" and
      # "published" become the same colour.
      - name: Say what happened
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MARKETPLACE: ${{ steps.tokens.outputs.marketplace }}
          OPENVSX: ${{ steps.tokens.outputs.openvsx }}
        run: |
          say() { [ "$1" = true ] && echo published || echo "skipped (no $2)"; }
          {
            echo "### $VSIX_NAME $VERSION"
            echo "- VS Marketplace: $(say "$MARKETPLACE" VSCE_PAT)"
            echo "- Open VSX: $(say "$OPENVSX" OVSX_PAT)"
          } >> "$GITHUB_STEP_SUMMARY"
