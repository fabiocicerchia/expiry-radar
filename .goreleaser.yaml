# GoReleaser builds the cross-platform binaries, the OS packages (deb, rpm, apk,
# Arch) and an SBOM per archive, and keyless-signs the checksums file with
# cosign using the GitHub Actions OIDC token — no long-lived keys.
#
# The release is created as a DRAFT: immutable releases reject asset uploads
# once a release is published, so every asset must land while it is still a
# draft. The workflow publishes it last. See .github/workflows/release.yml.
version: 2

project_name: expiry-radar

before:
  hooks:
    - go mod tidy

builds:
  - id: expiry-radar
    main: ./cmd/expiry-radar
    binary: expiry-radar
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: expiry-radar
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: man/*.1
        dst: man

# The OS packages. One binary, one man page, the licence and the readme — laid
# out where a packager expects them rather than in a tarball to unpack.
nfpms:
  - id: expiry-radar
    package_name: expiry-radar
    vendor: Fabio Cicerchia
    homepage: https://github.com/fabiocicerchia/expiry-radar
    maintainer: Fabio Cicerchia <info@fabiocicerchia.it>
    description: One inventory of everything that expires, ranked by blast radius
    license: Apache-2.0
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    section: utils
    contents:
      - src: man/expiry-radar.1
        dst: /usr/share/man/man1/expiry-radar.1
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/expiry-radar/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/expiry-radar/README.md
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

# One SBOM (SPDX JSON) per release archive.
sboms:
  - artifacts: archive

# Keyless cosign signature over checksums.txt — verifying the checksum then
# verifies every artifact it lists.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: fabiocicerchia
    name: expiry-radar
  # Created unpublished so the workflow can attach assets to it; the workflow
  # flips it to published as its last step.
  draft: true
  prerelease: auto
  footer: |
    ## Verify the download

    ```sh
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/fabiocicerchia/expiry-radar' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```
