# Least privilege for the Kubernetes source.
#
# The namespaced Role below is the whole of what the TLS-secret and cert-manager
# collectors need. The trust-anchor collectors read cluster-scoped objects and
# therefore need the ClusterRole at the bottom; if you do not want to grant it,
# set `skipWebhooks`, `skipAPIServices` and `skipMesh` in the config rather than
# leaving the run to warn about a permission nobody intends to give.
#
# secretsmanager-style caveat: `list` on secrets returns their contents, so this
# ServiceAccount can read every TLS private key in the namespaces it covers.
# Scope it to the namespaces that actually have ingress certificates
# (`k8s.namespaces` in the config) rather than granting the ClusterRole, unless
# you genuinely need a cluster-wide inventory.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: expiry-radar
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: expiry-radar-readonly
  namespace: prod
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  # cert-manager Certificates carry no key material: this rule says whether
  # renewal is working, which is the failure the secret above cannot show.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: expiry-radar-readonly
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: expiry-radar
    namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: expiry-radar-readonly
---
# Cluster-scoped variant.
#
# The first three rules are the cluster-wide inventory: only if you need every
# namespace at once. The rest are the trust anchors — the CA bundles the API
# server and the aggregation layer validate against, and the service mesh roots.
# Those are cluster-scoped objects, so there is no namespaced equivalent.
#
# The webhook and APIService rules cannot read a private key: a caBundle is the
# public half of a CA and nothing else.
#
# The mesh Secret rule is not in that category. It is split into its own block
# below, with the reason, so it is not granted by accident alongside the others.
# An earlier version of this file claimed the whole set was key-free, which was
# wrong.
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: expiry-radar-readonly
# rules:
#   - apiGroups: ["networking.k8s.io"]
#     resources: ["ingresses"]
#     verbs: ["list"]
#   - apiGroups: [""]
#     resources: ["secrets"]
#     verbs: ["list"]
#   - apiGroups: ["cert-manager.io"]
#     resources: ["certificates"]
#     verbs: ["list"]
#   - apiGroups: ["admissionregistration.k8s.io"]
#     resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
#     verbs: ["list"]
#   - apiGroups: ["apiregistration.k8s.io"]
#     resources: ["apiservices"]
#     verbs: ["list"]
#   # The Linkerd trust root. A ConfigMap, so it holds the root certificate
#   # and nothing else — as safe as the rules above.
#   - apiGroups: [""]
#     resources: ["configmaps"]
#     resourceNames: ["linkerd-identity-trust-roots"]
#     verbs: ["get"]
---
# THE MESH SIGNING SECRETS — read this before granting it.
#
# Kubernetes cannot return part of a Secret, so `get` on these returns the whole
# object, including the private key stored beside the certificate:
#
#   linkerd-identity-issuer   tls.key / key.pem   Linkerd identity issuer key
#   cacerts                   ca-key.pem          Istio intermediate CA key
#   istio-ca-secret           ca-key.pem          Istio root CA key
#
# Those are cluster-wide mTLS signing keys. Anyone who can read one can mint a
# workload identity for any service in the mesh, which makes this grant worth
# more than everything else in this file put together.
#
# expiry-radar parses only the certificate and never writes the key anywhere,
# but that is not the point — the grant is what a reviewer is approving, so it
# belongs on its own rather than buried among harmless read rules.
#
# What it buys: the Linkerd issuer lapses in a year by default and in
# twenty-four hours under cert-manager, which makes it the mesh certificate most
# likely to expire unnoticed, and the Istio entries are the only way to see that
# mesh's CAs at all.
#
# Known limitation as of today: `skipMesh` is all-or-nothing, so declining this
# grant and silencing the resulting 403s also gives up the Linkerd trust root
# above. Splitting the two is tracked as follow-up work.
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: expiry-radar-mesh-signing-secrets
# rules:
#   - apiGroups: [""]
#     resources: ["secrets"]
#     resourceNames: ["linkerd-identity-issuer", "cacerts", "istio-ca-secret"]
#     verbs: ["get"]
