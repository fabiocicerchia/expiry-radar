# Least privilege for the Kubernetes source.
#
# The namespaced Role below is the whole of what the TLS-secret and cert-manager
# collectors need. The trust-anchor collectors read cluster-scoped objects and
# therefore need the ClusterRole at the bottom; if you do not want to grant it,
# set `skipWebhooks`, `skipAPIServices` and `skipMesh` in the config rather than
# leaving the run to warn about a permission nobody intends to give.
#
# secretsmanager-style caveat: `list` on secrets returns their contents, so this
# ServiceAccount can read every TLS private key in the namespaces it covers.
# Scope it to the namespaces that actually have ingress certificates
# (`k8s.namespaces` in the config) rather than granting the ClusterRole, unless
# you genuinely need a cluster-wide inventory.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: expiry-radar
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: expiry-radar-readonly
  namespace: prod
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  # cert-manager Certificates carry no key material: this rule says whether
  # renewal is working, which is the failure the secret above cannot show.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: expiry-radar-readonly
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: expiry-radar
    namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: expiry-radar-readonly
---
# Cluster-scoped variant.
#
# The first three rules are the cluster-wide inventory: only if you need every
# namespace at once. The rest are the trust anchors — the CA bundles the API
# server and the aggregation layer validate against, and the service mesh roots.
# Those are cluster-scoped objects, so there is no namespaced equivalent.
#
# None of the trust-anchor rules can read a private key: a caBundle is the
# public half, and the mesh rule is `get` on four objects by name rather than
# `list` across every secret in the cluster.
